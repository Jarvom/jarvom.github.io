<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dream Big Builders MI</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Lato:wght@300;400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --gold: #C9A84C;
      --dark: #1A1A1A;
      --light: #F5F0E8;
      --mid: #7A6A50;
    }

    body {
      background-color: var(--dark);
      color: var(--light);
      font-family: 'Lato', sans-serif;
      font-weight: 300;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* Hero image section */
    .hero {
      width: 100%;
      height: 60vh;
      min-height: 320px;
      position: relative;
      overflow: hidden;
      background: #2a2a2a;
    }

    .hero img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
      opacity: 0.85;
    }

    /* Placeholder shown when no image is set */
    .hero-placeholder {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #2a2a2a 0%, #1a1a1a 100%);
      gap: 16px;
      color: var(--mid);
    }

    .hero-placeholder svg {
      width: 64px;
      height: 64px;
      opacity: 0.4;
    }

    .hero-placeholder p {
      font-size: 0.85rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      opacity: 0.5;
    }

    .hero-overlay {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 40%;
      background: linear-gradient(to top, var(--dark), transparent);
    }

    /* Logo / brand bar */
    .brand {
      padding: 48px 24px 12px;
      text-align: center;
      animation: fadeUp 1s ease both;
      animation-delay: 0.2s;
    }

    .brand h1 {
      font-family: 'Playfair Display', serif;
      font-size: clamp(1.8rem, 5vw, 3rem);
      font-weight: 700;
      letter-spacing: 0.04em;
      color: var(--light);
      line-height: 1.1;
    }

    .brand h1 span {
      color: var(--gold);
    }

    .divider {
      width: 60px;
      height: 2px;
      background: var(--gold);
      margin: 20px auto;
      animation: expandWidth 1s ease both;
      animation-delay: 0.5s;
    }

    /* Message card */
    .card {
      max-width: 620px;
      width: 90%;
      margin: 0 auto 60px;
      padding: 40px 48px;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(201, 168, 76, 0.2);
      border-radius: 2px;
      text-align: center;
      animation: fadeUp 1s ease both;
      animation-delay: 0.4s;
    }

    .card p {
      font-size: 1rem;
      line-height: 1.9;
      color: #c8bfad;
      letter-spacing: 0.02em;
    }

    .card a {
      color: var(--gold);
      text-decoration: none;
      border-bottom: 1px solid rgba(201, 168, 76, 0.4);
      transition: border-color 0.2s, color 0.2s;
      padding-bottom: 1px;
    }

    .card a:hover {
      color: #e8c86c;
      border-color: #e8c86c;
    }

    /* Under construction badge */
    .badge {
      display: inline-block;
      font-size: 0.7rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--gold);
      border: 1px solid rgba(201, 168, 76, 0.35);
      padding: 6px 16px;
      border-radius: 20px;
      margin-bottom: 28px;
    }

    /* Footer */
    footer {
      margin-top: auto;
      padding: 20px;
      font-size: 0.75rem;
      color: rgba(255,255,255,0.2);
      letter-spacing: 0.08em;
      text-align: center;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(24px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @keyframes expandWidth {
      from { width: 0; }
      to   { width: 60px; }
    }

    @media (max-width: 480px) {
      .card { padding: 32px 24px; }
    }
  </style>
</head>
<body>

  <!-- HERO IMAGE: Replace 'your-image.jpg' with your actual image filename -->
  <div class="hero">
    <!-- To add your image: upload it to the same folder as this file,
         then replace the src below with your image filename, e.g. src="logo.jpg" -->
    <img src="Dream BigClear.png" alt="Dream Big Builders MI"
         onerror="this.style.display='none'; document.querySelector('.hero-placeholder').style.display='flex';">
    <div class="hero-placeholder" style="display:none;">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1">
        <rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/>
        <polyline points="21 15 16 10 5 21"/>
      </svg>
      <p>Add your image — see instructions below</p>
    </div>
  </div>

  <!-- Brand name -->
  <div class="brand">
    <h1>Dream Big <span>Builders</span> LLC</h1>
  </div>

  <div class="divider"></div>

  <!-- Message -->
  <div class="card">
    <div class="badge">Under Construction</div>
    <p>
      Thank you for visiting. This website is currently under construction,
      but in the meantime feel free to reach out to us at the email below:
      <br><br>
      <a href="mailto:Cody.Brown@DreamBigBuildersMI.com">Cody.Brown@DreamBigBuildersMI.com</a>
    </p>
  </div>

  <footer>2026 Dream Big Builders LLC</footer>

</body>
</html>
